name: Terraform Deploy

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - infra/terraform/**
      - environments/**
      - lambda/**
      - .github/workflows/terraform-deploy.yml
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment to deploy
        type: choice
        required: true
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: github.ref_name == 'dev' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'dev')
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Missing required environment secret: AWS_ROLE_TO_ASSUME"
            exit 1
          fi
          if [[ -z "${{ vars.AWS_REGION }}" ]]; then
            echo "Missing required environment variable: AWS_REGION"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -var-file="../../environments/dev.tfvars" -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  deploy-staging:
    if: github.ref_name == 'staging' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'staging')
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Missing required environment secret: AWS_ROLE_TO_ASSUME"
            exit 1
          fi
          if [[ -z "${{ vars.AWS_REGION }}" ]]; then
            echo "Missing required environment variable: AWS_REGION"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -var-file="../../environments/staging.tfvars" -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  deploy-prod:
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'prod')
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Missing required environment secret: AWS_ROLE_TO_ASSUME"
            exit 1
          fi
          if [[ -z "${{ vars.AWS_REGION }}" ]]; then
            echo "Missing required environment variable: AWS_REGION"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -var-file="../../environments/prod.tfvars" -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
